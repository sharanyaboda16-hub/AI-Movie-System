<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews | Movie Recommendation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⭐ Movie Reviews</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="users.html">Users</a>
            <a href="reviews.html">Reviews</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Write a Review</h2>

            <form id="reviewForm">
                <input
                    type="number"
                    id="reviewUserId"
                    placeholder="Registered User ID"
                    min="1"
                    required
                >

                <input
                    type="number"
                    id="reviewMovieId"
                    placeholder="Movie ID"
                    min="1"
                    required
                >

                <label for="reviewRating">Your Rating (1–10)</label>
                <input
                    type="number"
                    id="reviewRating"
                    min="1"
                    max="10"
                    step="1"
                    placeholder="Rating"
                    required
                >

                <textarea
                    id="reviewComment"
                    placeholder="Write your review..."
                    required
                ></textarea>

                <button type="submit">Submit Review</button>
            </form>

            <p>
                Use the registered User ID and Movie ID from your database.
            </p>
        </section>

        <section>
            <h2>All Reviews</h2>
            <div id="reviews">
                <p>Loading reviews...</p>
            </div>
        </section>
    </main>

    <script src="reviews.js"></script>
</body>
</html>
