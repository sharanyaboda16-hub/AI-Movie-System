<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movies | Movie Recommendation System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 Movie Recommendation System</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
        </nav>
    </header>

    <main>

        <!-- Add Movie Form -->
        <section>
            <h2>➕ Add a Movie</h2>

            <form id="movieForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Movie Title"
                    required
                >

                <input
                    type="text"
                    id="genre"
                    placeholder="Genre (Action, Comedy...)"
                    required
                >

                <input
                    type="text"
                    id="language"
                    placeholder="Language"
                    required
                >

                <input
                    type="number"
                    id="year"
                    placeholder="Release Year"
                    min="1888"
                    max="2100"
                    required
                >

                <input
                    type="number"
                    id="rating"
                    placeholder="Rating (0–10)"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Movie Description"
                    required
                ></textarea>

                <button type="submit">Add Movie</button>

            </form>
        </section>

        <!-- Search Real Movies from TMDB -->
        <section>
            <h2>🌟 Search Real Movies</h2>

            <input
                type="text"
                id="tmdbSearch"
                placeholder="Search movies, e.g. RRR, Avatar..."
            >

            <button type="button" id="tmdbSearchButton">
                Search TMDB
            </button>

            <div id="tmdbMovies">
                <p>Search for a movie to see its poster and details.</p>
            </div>
        </section>

        <!-- Search and Filter Locally Saved Movies -->
        <section>
            <h2>🎥 Available Movies</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search movies by title..."
            >

            <select id="genreFilter">
                <option value="">All Genres</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Romance">Romance</option>
                <option value="Thriller">Thriller</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Adventure">Adventure</option>
                <option value="Animation">Animation</option>
                <option value="Fantasy">Fantasy</option>
            </select>

            <div id="movies">
                <p>Loading movies...</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
